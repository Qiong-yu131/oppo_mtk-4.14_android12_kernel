name: Build Kernel

on:
  workflow_dispatch:

jobs:
  build:
    name: Build Kernel
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Source
      uses: actions/checkout@v4

    - name: Set up environment
      run: |
        sudo apt update
        sudo apt install -y bc bison cpio curl flex git make libssl-dev \
          libncurses-dev python3 unzip zip zlib1g-dev libelf-dev

    - name: Clone Clang 11
      run: |
        git clone --depth=1 https://github.com/ZyCromerZ/Clang/releases/download/11.0.5-20210901/clang-11.0.5.tar.gz
        mkdir -p kernel/toolchains
        tar -xzf clang-11.0.5.tar.gz -C kernel/toolchains
        mv kernel/toolchains/clang* kernel/toolchains/clang-11

    - name: Clone GCC (aarch64 & arm32)
      run: |
        git clone --depth=1 https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_aarch64_aarch64-linux-android-4.9.git \
          kernel/toolchains/gcc-aarch64
        git clone --depth=1 https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_arm_arm-linux-androideabi-4.9.git \
          kernel/toolchains/gcc-arm32

    - name: Build Kernel
      run: |
        export KERNEL_DIR=$PWD
        export CLANG_PATH=$KERNEL_DIR/kernel/toolchains/clang-11
        export GCC_AARCH64_PATH=$KERNEL_DIR/kernel/toolchains/gcc-aarch64
        export GCC_ARM32_PATH=$KERNEL_DIR/kernel/toolchains/gcc-arm32

        export PATH=$CLANG_PATH/bin:$GCC_AARCH64_PATH/bin:$GCC_ARM32_PATH/bin:$PATH

        make -C kernel \
          O=out \
          ARCH=arm64 \
          CC=clang \
          CLANG_TRIPLE=aarch64-linux-gnu- \
          CROSS_COMPILE=aarch64-linux-android- \
          CROSS_COMPILE_ARM32=arm-linux-androideabi- \
          k6893v1_64_defconfig

        make -C kernel \
          -j$(nproc) \
          O=out \
          ARCH=arm64 \
          CC=clang \
          CLANG_TRIPLE=aarch64-linux-gnu- \
          CROSS_COMPILE=aarch64-linux-android- \
          CROSS_COMPILE_ARM32=arm-linux-androideabi-

    - name: Upload Image
      uses: actions/upload-artifact@v4
      with:
        name: kernel-image
        path: kernel/out/arch/arm64/boot/Image.gz-dtb
