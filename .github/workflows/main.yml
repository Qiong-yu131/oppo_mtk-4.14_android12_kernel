name: Build Kernel

on:
  push:
    branches:
      - coloros12.1

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout kernel source
      uses: actions/checkout@v3

    - name: Install dependencies
      run: sudo apt update && sudo apt install -y bc bison build-essential cpio curl flex gcc libssl-dev libelf-dev libncurses5-dev libncursesw5-dev xz-utils

    - name: Download and extract Clang r383902
      run: |
        mkdir -p kernel/clang-r383902
        wget https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/android12-release/clang-r383902.tar.gz -O clang-r383902.tar.gz
        tar -xzf clang-r383902.tar.gz -C kernel/clang-r383902

    - name: Setup environment and build
      run: |
        export CLANG_PATH=$(pwd)/kernel/clang-r383902
        export PATH=$CLANG_PATH/bin:$PATH
        export LD_LIBRARY_PATH=$CLANG_PATH/lib64:$LD_LIBRARY_PATH
        export LINUX_GCC_CROSS_COMPILE_PREBUILTS_BIN_A=$CLANG_PATH/aarch64-linux-android/bin
        export LINUX_GCC_CROSS_COMPILE_PREBUILTS_BIN_B=$CLANG_PATH/arm-linux-androideabi-4.9/bin
        export PATH=$LINUX_GCC_CROSS_COMPILE_PREBUILTS_BIN_A:$LINUX_GCC_CROSS_COMPILE_PREBUILTS_BIN_B:$PATH

        cd kernel
        make -j$(nproc) \
          O=out \
          NM=llvm-nm \
          OBJCOPY=llvm-objcopy \
          ARCH=arm64 \
          BRANCH=android-4.14 \
          CC=clang \
          LD=ld.lld \
          CLANG_TRIPLE=aarch64-linux-gnu- \
          CROSS_COMPILE=aarch64-linux-androidkernel- \
          CROSS_COMPILE_COMPAT=arm-linux-androidkernel- \
          CROSS_COMPILE32=arm-linux-androidkernel- \
          CROSS_COMPILE_ARM32=arm-linux-androidkernel- \
          k6893v1_64_defconfig

        make -j$(nproc) \
          O=out \
          NM=llvm-nm \
          OBJCOPY=llvm-objcopy \
          ARCH=arm64 \
          BRANCH=android-4.14 \
          CC=clang \
          LD=ld.lld \
          CLANG_TRIPLE=aarch64-linux-gnu- \
          CROSS_COMPILE=aarch64-linux-androidkernel- \
          CROSS_COMPILE_COMPAT=arm-linux-androidkernel- \
          CROSS_COMPILE32=arm-linux-androidkernel- \
          CROSS_COMPILE_ARM32=arm-linux-androidkernel-
