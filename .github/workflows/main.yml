name: Build Kernel

on:
  push:
    branches:
      - coloros12.1

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout kernel source
      uses: actions/checkout@v3

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y bc bison flex libssl-dev libelf-dev \
          build-essential ccache curl git python3 unzip wget

    - name: Clone Clang (LLVM)
      run: |
        git clone --depth=1 https://github.com/ClangBuiltLinux/tc-build.git
        mkdir clang
        python3 tc-build/tc-build.py \
          --cc clang \
          --targets arm64 \
          --install-folder clang

    - name: Clone GCC 64-bit (aarch64-linux-android-4.9)
      run: |
        git clone --depth=1 https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_aarch64_aarch64-linux-android-4.9.git gcc64

    - name: Clone GCC 32-bit (arm-linux-androideabi-4.9)
      run: |
        git clone --depth=1 https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_arm_arm-linux-androideabi-4.9.git gcc32

    - name: Build Kernel
      run: |
        export PATH="$GITHUB_WORKSPACE/clang/bin:$GITHUB_WORKSPACE/gcc64/bin:$GITHUB_WORKSPACE/gcc32/bin:$PATH"
        export ARCH=arm64
        export SUBARCH=arm64
        export CLANG_TRIPLE=aarch64-linux-gnu-
        export CROSS_COMPILE=aarch64-linux-android-
        export CROSS_COMPILE_ARM32=arm-linux-androideabi-

        make O=out k6893v1_64_defconfig
        make -j$(nproc) O=out \
          CC=clang \
          LD=ld.lld \
          NM=llvm-nm \
          AR=llvm-ar \
          AS=llvm-as \
          OBJCOPY=llvm-objcopy \
          OBJDUMP=llvm-objdump \
          STRIP=llvm-strip \
          CROSS_COMPILE=aarch64-linux-android- \
          CROSS_COMPILE_ARM32=arm-linux-androideabi- \
          CLANG_TRIPLE=aarch64-linux-gnu-

    - name: Upload Image
      uses: actions/upload-artifact@v3
      with:
        name: kernel-image
        path: out/arch/arm64/boot/Image.gz-dtb
