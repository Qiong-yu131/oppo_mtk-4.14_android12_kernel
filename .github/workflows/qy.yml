name: Build Kernel

on:
  push:
    branches: [ coloros12.1 ]
  pull_request:
    branches: [ coloros12.1 ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v2

      - name: Download Clang (android12 clang-r383902)
        run: |
          wget https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/android12-release/clang-r383902.tar.gz -O clang.tar.gz
          mkdir -p kernel/clang12
          tar -xzf clang.tar.gz -C kernel/clang12

      - name: Clone aarch64-linux-android GCC
        run: |
          git clone --depth=1 https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_aarch64_aarch64-linux-android-4.9.git gcc64

      - name: Clone arm-linux-androideabi GCC
        run: |
          git clone --depth=1 https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_arm_arm-linux-androideabi-4.9.git gcc32

      - name: Setup environment and build
        run: |
          export KERNEL_ROOT=$(pwd)
          export CLANG_PATH=$KERNEL_ROOT/kernel/clang12
          export GCC64_PATH=$KERNEL_ROOT/gcc64
          export GCC32_PATH=$KERNEL_ROOT/gcc32

          export PATH=$CLANG_PATH/bin:$GCC64_PATH/bin:$GCC32_PATH/bin:$PATH
          export LD_LIBRARY_PATH=$CLANG_PATH/lib64:$LD_LIBRARY_PATH

          export ARCH=arm64
          export SUBARCH=arm64
          export CROSS_COMPILE=aarch64-linux-android-
          export CROSS_COMPILE_ARM32=arm-linux-androideabi-
          export CLANG_TRIPLE=aarch64-linux-gnu-

          make O=out k6893v1_64_defconfig
          make -j$(nproc) O=out

      - name: Upload Kernel Image
        uses: actions/upload-artifact@v2
        with:
          name: kernel-image
          path: out/arch/arm64/boot/
