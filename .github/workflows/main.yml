name: Build Kernel with Custom Clang

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. 克隆主仓库
      - name: Checkout main repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # 2. 克隆自定义 Clang 工具链到 toolchains/clang
      - name: Checkout Clang toolchain
        run: |
          git clone --depth=1 https://github.com/Qiong-yu131/clang11.git

      # 3. 设置 Clang 环境变量
      - name: Setup Clang in PATH
        run: |
          echo "${GITHUB_WORKSPACE}/toolchains/clang/bin" >> $GITHUB_PATH
          echo "CC=clang" >> $GITHUB_ENV

      # 4. 切换到 kernel 目录并执行 b 脚本
      - name: Build kernel via b
        working-directory: kernel
        run: |
          chmod +x b
          ./b

      # 5. 上传内核产物
      - name: Upload kernel artifacts
        uses: actions/upload-artifact@v4
        with:
          name: kernel-output
          path: |
            kernel/out/Image
            kernel/out/boot.img
